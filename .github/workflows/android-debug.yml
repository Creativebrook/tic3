name: Android Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: "4.3"
  EXPORT_NAME: "tic3-debug"

jobs:
  android-debug:
    name: Build Android debug APK
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Godot export environment
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p ~/.local/share/godot/export_templates/
          mkdir -p ~/.config/
          mv /root/.config/godot ~/.config/godot
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          echo "Java: $(readlink -f $(command -v java))"
          echo "Android SDK: $ANDROID_HOME"
          test -f /root/debug.keystore
          test -f ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/android_debug.apk

      - name: Parse project and import resources
        run: godot --headless --verbose --editor --quit --path .

      - name: Build debug APK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build/android
          godot --headless --verbose --path . --export-debug "Android Debug" "build/android/${EXPORT_NAME}.apk"
          test -f "build/android/${EXPORT_NAME}.apk"
          ls -lh build/android/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tic3-android-debug
          path: build/android/tic3-debug.apk
          if-no-files-found: error
          retention-days: 14
