name: Android Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: "4.3"
  EXPORT_NAME: "tic3-debug"

jobs:
  android-debug:
    name: Build Android debug APK
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Godot CI environment
        shell: bash
        run: |
          mkdir -p ~/.local/share/godot/export_templates/
          mkdir -p ~/.config/
          if [ -d /root/.config/godot ]; then
            rm -rf ~/.config/godot
            mv /root/.config/godot ~/.config/godot
          fi
          if [ -d /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ]; then
            rm -rf ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
            mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          fi
          SETTINGS=~/.config/godot/editor_settings-4.3.tres
          touch "$SETTINGS"
          if ! grep -q 'export/android/java_sdk_path' "$SETTINGS"; then
            echo 'export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"' >> "$SETTINGS"
          fi

      - name: Parse project and import resources
        run: godot --headless --verbose --editor --quit --path .

      - name: Build debug APK
        shell: bash
        run: |
          mkdir -p build/android
          godot --headless --verbose --path . --export-debug "Android Debug" "build/android/${EXPORT_NAME}.apk"
          test -f "build/android/${EXPORT_NAME}.apk"
          ls -lh build/android/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tic3-android-debug
          path: build/android/tic3-debug.apk
          if-no-files-found: error
          retention-days: 14
