name: Android Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: "4.3"
  EXPORT_NAME: "tic3-debug"

jobs:
  android-debug:
    name: Build Android debug APK
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Godot CI environment
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p ~/.local/share/godot/export_templates/
          mkdir -p ~/.config/
          if [ -d /root/.config/godot ]; then
            rm -rf ~/.config/godot
            mv /root/.config/godot ~/.config/godot
          fi
          if [ -d /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ]; then
            rm -rf ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
            mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          fi

          SETTINGS=~/.config/godot/editor_settings-4.3.tres
          touch "$SETTINGS"
          if grep -q '^export/android/java_sdk_path' "$SETTINGS"; then
            sed -i 's#^export/android/java_sdk_path.*#export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"#' "$SETTINGS"
          else
            echo 'export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"' >> "$SETTINGS"
          fi
          if grep -q '^export/android/android_sdk_path' "$SETTINGS"; then
            sed -i 's#^export/android/android_sdk_path.*#export/android/android_sdk_path = "/usr/lib/android-sdk"#' "$SETTINGS"
          else
            echo 'export/android/android_sdk_path = "/usr/lib/android-sdk"' >> "$SETTINGS"
          fi

          if [ ! -d "$ANDROID_HOME/platforms/android-34" ] || [ ! -d "$ANDROID_HOME/build-tools/34.0.0" ]; then
            yes | sdkmanager --sdk_root="$ANDROID_HOME" "platform-tools" "build-tools;34.0.0" "platforms;android-34" || true
          fi
          test -d "$ANDROID_HOME/platforms/android-34"
          test -d "$ANDROID_HOME/build-tools/34.0.0"

          mkdir -p ~/.android .godot
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          keytool -list -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey

          cat > .godot/export_credentials.cfg <<'EOF'
          [preset.0.options]
          keystore/debug="/github/home/.android/debug.keystore"
          keystore/debug_user="androiddebugkey"
          keystore/debug_password="android"
          keystore/release=""
          keystore/release_user=""
          keystore/release_password=""
          EOF

          echo "--- Android editor settings ---"
          grep -n 'export/android' "$SETTINGS" || true
          echo "--- Export credentials ---"
          cat .godot/export_credentials.cfg
          echo "--- Android templates ---"
          ls -lah ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Parse project and import resources
        run: godot --headless --verbose --editor --quit --path .

      - name: Build debug APK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build/android
          godot --headless --verbose --path . --export-debug "Android Debug" "build/android/${EXPORT_NAME}.apk"
          test -f "build/android/${EXPORT_NAME}.apk"
          ls -lh build/android/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tic3-android-debug
          path: build/android/tic3-debug.apk
          if-no-files-found: error
          retention-days: 14
